<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="tabGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="frontGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Folder Back Body & Tab -->
  <path d="M12 20c0-2.2 1.8-4 4-4h11c1.3 0 2.5.6 3.2 1.7L32 20h16c2.2 0 4 1.8 4 4v5H12v-9z" fill="url(#tabGrad)"/>

  <!-- Folder Front Card with Drop Shadow -->
  <rect x="10" y="24" width="44" height="26" rx="5" fill="url(#frontGrad)" filter="url(#cardShadow)"/>

  <!-- Accent Line on Front Card -->
  <path d="M10 28.5h44" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Dynamic Energy Bolt / Hosting Emblem -->
  <path d="M34.5 28.5l-6 8.5h5.5l-2.5 8 8.5-9.5h-5.5l2.5-7z" fill="url(#boltGrad)"/>
</svg>
